# Drop-in for the existing ALASH service on Invest. Preserve its database/env.
[Service]
ExecStart=
ExecStart=/usr/bin/docker run --rm --name m1917-backend-runtime --network host --env-file /etc/m1917/backend.codex.env --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=128m,mode=1777 alash-backend:current uvicorn backend:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips=127.0.0.1
ExecStop=
ExecStop=/usr/bin/docker stop -t 20 m1917-backend-runtime
Restart=always
RestartSec=5
TimeoutStopSec=40
